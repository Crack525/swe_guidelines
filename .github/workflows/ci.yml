name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: markdown, lenses, leaks, links, skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: make check
        run: make check
